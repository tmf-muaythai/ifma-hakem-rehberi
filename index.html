<!doctype html>
<html lang="tr" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    (function () {
      var projectRoot = "/ifma-hakem-rehberi/";
      var markerAt = location.pathname.indexOf(projectRoot);
      var basePath = markerAt >= 0
        ? location.pathname.slice(0, markerAt + projectRoot.length)
        : "/";
      var base = new URL(basePath, location.origin).href;
      var el = document.createElement('base');
      el.href = base;
      document.head.appendChild(el);
    })();
  </script>
  <title>Muaythai Hakem Rehberi — IFMA 2026 Kuralları</title>
  <meta name="description" content="IFMA 2026 kurallarını hızlı, görsel ve kaynağı açık bir dijital rehbere dönüştüren hakem uygulaması." />
  <meta name="theme-color" content="#123F68" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hakem Rehberi" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link id="altTr" rel="alternate" hreflang="tr" href="https://tmf-muaythai.github.io/ifma-hakem-rehberi/tr/" />
  <link id="altEn" rel="alternate" hreflang="en" href="https://tmf-muaythai.github.io/ifma-hakem-rehberi/en/" />
  <link id="altDefault" rel="alternate" hreflang="x-default" href="https://tmf-muaythai.github.io/ifma-hakem-rehberi/tr/" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Noto+Sans+Thai:wght@400;600;700&amp;display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Açılış ekranı: uygulama ilk yüklenirken kısaca gösterilir, sonra kaybolur -->
  <div id="appSplash" class="app-splash" aria-hidden="true">
    <picture>
      <source media="(min-width:860px)" srcset="assets/img/splash-desktop.jpg" />
      <img class="app-splash-img" src="assets/img/splash-mobile.jpg" alt="" />
    </picture>
  </div>
  <script>
    (function () {
      var el = document.getElementById("appSplash");
      if (!el) return;
      var MIN_MS = 700, MAX_MS = 4000, start = Date.now(), done = false;
      function hide() {
        if (done) return;
        done = true;
        var wait = Math.max(0, MIN_MS - (Date.now() - start));
        setTimeout(function () {
          el.classList.add("is-hidden");
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
        }, wait);
      }
      if (document.readyState === "complete") hide();
      else window.addEventListener("load", hide);
      setTimeout(hide, MAX_MS);
    })();
  </script>

  <div id="app" class="app" data-lang="tr">
    <header id="appHeader" class="app-header"></header>
    <main id="main" class="main" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar" aria-label="Ana navigasyon"></nav>
  </div>
  <div id="sheet" class="sheet" hidden></div>

  <script>
    (function () {
      try {
        var target = sessionStorage.getItem("ifma_redirect");
        if (target) { sessionStorage.removeItem("ifma_redirect"); history.replaceState(null, "", target); }
      } catch (e) {}
    })();
  </script>

  <!-- İçerik (koddan ayrı) -->
  <script src="data/meta.js"></script>
  <script src="data/categories.js"></script>
  <script src="data/modules.js"></script>
  <script src="data/cards.js"></script>
  <script src="data/flows.js"></script>
  <!-- Uygulama mantığı -->
  <script src="js/icons.js"></script>
  <script src="js/search.js"></script>
  <script src="js/diagrams.js"></script>
  <script src="js/app.js"></script>

  <!-- PWA servis çalışanı: yalnızca http/https'te (file:// demoda atlanır) -->
  <script>
    if ('serviceWorker' in navigator &&
        (location.protocol === 'https:' || location.protocol === 'http:')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.log('[IFMA] SW kaydı atlandı:', e && e.message);
        });
      });
    }
  </script>
</body>
</html>
